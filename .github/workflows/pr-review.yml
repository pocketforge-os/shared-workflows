# PR review — self-caller for the shared reusable gate.
#
# This repo HOSTS pr-review-gate.yml — so this thin caller uses the local path
# (./.github/workflows/pr-review-gate.yml) so that any PR to this repo tests the
# gate on its own head (dogfood). Other repos in the org use a cross-repo
# `uses:` pointing at pocketforge-os/shared-workflows/.github/workflows/pr-review-gate.yml@main.
# Keep the job id `pf-pr-review` — the org-wide required-check context
# "pf-pr-review / review" must be uniform (tsp-mx3).

name: PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# One review RUN per PR: a new push cancels the superseded run AT TRIGGER TIME,
# so stale-head runs never sit in the queue holding saturated runner slots
# (tsp-ikk0.8; the gate's job-level concurrency only takes effect at job
# pickup, which is why queued duplicates accumulated). The group name MUST
# stay distinct from the gate job's group (`pf-pr-review-<repo>-<n>`):
# identical groups at workflow level and job level of the same run are
# detected by GitHub as a concurrency DEADLOCK and the review job is
# cancelled (github/vscode-github-actions#135) — do NOT "unify" the names.
concurrency:
  group: pf-pr-review-run-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pf-pr-review:
    uses: ./.github/workflows/pr-review-gate.yml
