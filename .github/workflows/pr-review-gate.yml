# pr-review-gate — org-reusable PR peer-review merge gate (tsp-8ny).
#
# Runs the 3-phase opencode peer review (scripts/review-pr.sh, built in tsp-9qd)
# against the CALLING repo's pull request and turns its exit code into the
# status check that gates merging:
#
#   exit 0 -> check passes  (clean, or non-blocking findings only)
#   exit 4 -> check FAILS   (blocking findings: CRITICAL/high survived verification)
#   exit 2 -> check FAILS   (workflow failure — e.g. reason=model_unreachable when
#                            the solar-powered model host is down; the review report
#                            is NOT lost, just absent; re-run the job when it's back)
#
# The review report is posted to the PR as ONE sticky comment (updated in place
# per run) BEFORE the script exits nonzero, so a red check always has its report
# sitting next to it on the PR. The gate is the EXIT CODE, not a bot review —
# approve/request-changes reviews 422 on same-account PRs, so a required status
# check is the only author-agnostic mechanism.
#
# Rollout per repo (see .github/workflows/pr-review.yml in this repo for the
# canonical thin caller):
#   1. copy the thin caller workflow (job id MUST stay `pf-pr-review` so the
#      check context is uniform org-wide),
#   2. mark the check required in branch protection on the default branch.
#
# Runner: the dedicated self-hosted lab runner (label pf-pr-review, installed by
# scripts/install-pr-review-runner.sh on the Dell) — the review needs the opencode
# CLI and network reach to the lab model host, which GitHub-hosted runners don't
# have. Draft PRs skip the job (a skipped required check does not block; flipping
# ready_for_review re-triggers the caller).

name: pr-review-gate

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, pf-pr-review]
    timeout-minutes: 60
    concurrency:
      # One review per PR at a time; a new push supersedes the in-flight run.
      group: pf-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Persistent runner-local clone of this repo (the runner user's stored
      # read credential): the review tooling always runs from origin/main, no
      # matter which repo's PR is under review.
      PF_AUTOMATION_DIR: /home/github-runner/pf/pocketforge-automation
    steps:
      - name: Sync review tooling to origin/main
        run: |
          if [ ! -d "$PF_AUTOMATION_DIR/.git" ]; then
            mkdir -p "$(dirname "$PF_AUTOMATION_DIR")"
            git clone --quiet https://github.com/pocketforge-os/pocketforge-automation "$PF_AUTOMATION_DIR"
          fi
          git -C "$PF_AUTOMATION_DIR" fetch --quiet origin main
          git -C "$PF_AUTOMATION_DIR" checkout --quiet --detach origin/main
          echo "tooling: $(git -C "$PF_AUTOMATION_DIR" log -1 --oneline)"
          # Each PR's workdir is reused per run (review-pr.sh rm -rf's it), but
          # distinct PRs would still accumulate on this persistent clone — prune
          # any untouched for 14+ days so the runner disk stays bounded.
          find "$PF_AUTOMATION_DIR/logs/pr-review" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + 2>/dev/null || true

      - name: Peer review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -o pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          cd "$PF_AUTOMATION_DIR"
          log="$RUNNER_TEMP/pf-pr-review.log"
          rc=0
          ./scripts/review-pr.sh "$PR_URL" 2>&1 | tee "$log" || rc=$?
          {
            echo "## PR peer review"
            echo '```'
            grep -hE '^(review_pr|head|auto_context_pr|auto_context_skipped|context_pr|context_pr_skipped|static_analysis_lines|review_status|review_verdict|counts|posted|reason)=' "$log" || true
            echo '```'
            case "$rc" in
              0) echo "**PASS** — clean, or non-blocking findings only. Report is on the PR." ;;
              4) echo "**BLOCKED** — blocking findings survived verification. The full report is the pinned review comment on the PR; push a fix to re-run." ;;
              *) echo "**WORKFLOW FAILURE** (exit $rc) — see reason above. If reason=model_unreachable the lab model host is down: re-run this job once it is back up." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
